<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbo Arcade 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;font-family:system-ui,sans-serif}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 5px #000b;
       padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  .box{position:absolute;background:#0007;border-radius:12px;padding:8px 14px;font-size:20px}
  #menu{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#1b2a4a,#0c1424);color:#fff;overflow:auto;padding:16px;box-sizing:border-box}
  #menu h1{margin:0;font-size:34px} #menu h2{margin:6px 0 0;font-size:17px;opacity:.8}
  #menu button{background:#fff1;border:2px solid #fff3;color:#fff;border-radius:14px;padding:10px 14px;font-size:15px;cursor:pointer}
  #menu button.on{border-color:var(--c,#ffd400);background:#fff3;box-shadow:0 0 14px var(--c,#ffd400)}
  #chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:min(760px,100%)}
  #chars button{display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:6px solid var(--c)} .em{font-size:44px} #menu button.lock{opacity:.45;cursor:not-allowed}
  #maps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(760px,100%)}
  #go{font-size:26px;font-weight:900;background:#ffd400!important;color:#111!important;padding:12px 40px!important;border:none!important}
  #radar{position:absolute;top:12px;left:12px;width:160px;height:160px;border-radius:12px;background:#0008}
  #item{bottom:14px;left:50%;transform:translateX(-50%);font-size:34px;min-width:50px;text-align:center}
  #lap{top:182px;left:12px;font-size:16px} #pos{top:12px;right:12px;font-size:26px} #time{top:12px;left:50%;transform:translateX(-50%)}
  #spd{bottom:14px;right:12px}
  #msg{position:absolute;top:38%;width:100%;text-align:center;font-size:84px}
  #help{position:absolute;bottom:14px;left:12px;font-size:13px;font-weight:600;opacity:.9}
</style>
</head>
<body>
<div id="hud">
  <canvas id="radar" width="320" height="320"></canvas><div id="lap" class="box"></div><div id="item" class="box">—</div><div id="time" class="box"></div><div id="pos" class="box"></div>
  <div id="spd" class="box"></div><div id="msg"></div>
  <div id="help">↑/W acelera · ↓/S freia/ré · ←→/AD esterça · ESPAÇO drift · R reinicia · 1-7 mapa · M menu · N música · E/Shift usa item</div>
</div>
<script>
// Mostra qualquer erro na tela (ajuda a diagnosticar tela preta)
addEventListener('error', e => { const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#300d;color:#fff;padding:10px;font:12px monospace;white-space:pre-wrap;border-radius:8px;max-height:50vh;overflow:auto';
  d.textContent = 'Erro: ' + e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''); (document.body || document.documentElement).appendChild(d); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>
// ================= CONFIGURAÇÃO =================
const N = 900;        // amostras da pista
const W = 26;         // largura da pista
const LAPS = 3;       // voltas
const MAXV = 75;      // velocidade máxima (unidades/s)

// ================= CENA =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 150, 700);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 1500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; // sombras suaves
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(100, 200, 50);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
const sc = sun.shadow.camera; sc.left = sc.bottom = -50; sc.right = sc.top = 50; sc.near = 10; sc.far = 500;
scene.add(sun, sun.target); // a luz acompanha o jogador no loop

// Chão
// Textura de grama procedural (folhas de capim), tingida pela cor de cada mapa
const gc = document.createElement('canvas'); gc.width = gc.height = 256;
(c => { c.fillStyle = '#fff'; c.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 6000; i++) { const g = 140 + Math.random() * 110 | 0; c.fillStyle = `rgb(${g},${g},${g})`; c.fillRect(Math.random() * 256, Math.random() * 256, 2, Math.random() * 6 + 1); } })(gc.getContext('2d'));
const gt = new THREE.CanvasTexture(gc); gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(250, 250); gt.anisotropy = 8;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ map: gt, color: 0x3f9b4a }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -3; ground.receiveShadow = true; scene.add(ground);

// ================= PISTA =================
// Curva fechada passando por pontos de controle (x, z): retas e curvas
// Mapas disponíveis (teclas 1, 2, 3)
const MAPS = [
  { name: 'Circuito Verde', sc: 1.5, hills: [[10, 2, 0], [4, 5, 1]], sky: 0x87ceeb, grass: 0x3f9b4a, leaf: 0x2b7a34, trees: 160,
    pts: [[0,0],[150,0],[260,-30],[320,-120],[280,-220],[170,-260],[120,-340],[20,-400],[-110,-370],[-170,-280],[-120,-190],[-200,-100],[-150,-20],[-60,10]] },
  { name: 'Deserto Rápido', sc: 1.4, hills: [[14, 1, .5], [6, 3, 0]], sky: 0xf0c987, grass: 0xd2a05a, leaf: 0x8a9a3a, trees: 50,
    pts: [[0,0],[200,0],[330,-40],[380,-140],[330,-230],[220,-250],[180,-320],[230,-400],[140,-470],[0,-450],[-80,-360],[-60,-260],[-150,-200],[-220,-110],[-150,-30]] },
  { name: 'Montanha Gelada', sc: 1.4, hills: [[20, 2, 1], [8, 4, 0]], sky: 0xbfd9ee, grass: 0xe6eef8, leaf: 0x2d5f46, trees: 140,
    pts: [[0,0],[120,0],[200,-60],[190,-150],[260,-210],[340,-170],[400,-250],[350,-350],[240,-340],[150,-400],[40,-380],[-30,-300],[-130,-330],[-210,-250],[-170,-150],[-80,-100],[-60,-30]] },
  { name: 'Cânion Vermelho', sc: 1, hills: [[22, 2, 0], [9, 5, 2]], sky: 0xe9a36a, grass: 0xc4733f, leaf: 0x7d8f3a, trees: 30,
    pts: [[0,0],[300,0],[560,-40],[700,-160],[720,-320],[620,-460],[460,-520],[400,-640],[480,-760],[360,-860],[160,-840],[40,-740],[-40,-600],[-200,-540],[-320,-420],[-300,-260],[-180,-160],[-80,-60]] },
  { name: 'Praia Tropical', sc: 1, hills: [[12, 3, 0], [6, 7, 1]], sky: 0x7fd8ff, grass: 0xe8d9a0, leaf: 0x1f9a4a, trees: 120,
    pts: [[0,0],[250,40],[500,0],[720,-80],[860,-250],[800,-430],[620,-500],[520,-640],[600,-800],[480,-940],[260,-900],[140,-760],[-40,-720],[-200,-780],[-340,-680],[-320,-500],[-180,-400],[-260,-250],[-200,-100]] },
  { name: 'Floresta Sombria', sc: 1, hills: [[16, 2, 1], [10, 6, 0]], sky: 0x7a6a9a, grass: 0x1f4a2a, leaf: 0x15402a, trees: 260,
    pts: [[0,0],[180,0],[320,-60],[360,-180],[300,-290],[180,-330],[120,-440],[200,-540],[340,-580],[420,-700],[340,-820],[180,-800],[60,-700],[-80,-650],[-180,-540],[-120,-420],[-230,-320],[-320,-200],[-240,-90],[-110,-60]] },
  { name: 'Vulcão', sc: 1, hills: [[26, 2, 0], [10, 4, 1]], sky: 0xd8745a, grass: 0x3a2a26, leaf: 0x4a3a30, trees: 70,
    pts: [[0,0],[280,-30],[520,-120],[640,-300],[600,-500],[440,-620],[420,-780],[560,-900],[480,-1040],[260,-1060],[60,-960],[-60,-800],[40,-640],[-80,-500],[-240,-420],[-300,-260],[-200,-120]] }
];
let S, T, Nm, ds, world = [], mapI = 0, boxes = [], radarBg, rb;
const hazards = [], shells = [];
// Constrói pista, cenário, caixas de item e radar do mapa escolhido (remove o anterior)
function buildMap(mi) {
  mapI = mi; const M = MAPS[mi];
  world.forEach(o => { scene.remove(o); if (o.geometry) o.geometry.dispose(); }); const n0 = scene.children.length;
  scene.background.set(M.sky); scene.fog.color.set(M.sky); ground.material.color.set(M.grass);
  const cp = M.pts.map(p => new THREE.Vector3(p[0] * M.sc, 0, p[1] * M.sc));
const curve = new THREE.CatmullRomCurve3(cp, true, 'centripetal');
S = curve.getSpacedPoints(N).slice(0, N);                 // pontos igualmente espaçados
ds = curve.getLength() / N;
  // Altura da pista: subidas e descidas (soma de senos, sempre >= 0 e periódica)
  S.forEach((p, i) => { p.y = M.hills.reduce((s, [a, f, ph]) => s + a * (1 + Math.sin(2 * Math.PI * f * i / N + ph)), 0); });                               // distância entre amostras
T = S.map((p, i) => S[(i + 1) % N].clone().sub(S[(i - 1 + N) % N]).setY(0).normalize()); // tangentes
Nm = T.map(t => new THREE.Vector3(-t.z, 0, t.x));         // normais (lado)

// Cria uma fita 3D ao longo da pista (asfalto e zebras)
function ribbon(w, y, colorFn) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const k = i % N, p = S[k], n = Nm[k], c = colorFn(i);
    pos.push(p.x + n.x * w / 2, y + p.y, p.z + n.z * w / 2, p.x - n.x * w / 2, y + p.y, p.z - n.z * w / 2);
    col.push(...c, ...c);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  mesh.receiveShadow = true; return mesh;
}
scene.add(ribbon(W + 5, 0.03, i => (Math.floor(i / 4) % 2 ? [0.9, 0.1, 0.1] : [1, 1, 1])));  // zebras
scene.add(ribbon(W, 0.06, i => (Math.floor(i / 10) % 2 ? [0.27, 0.27, 0.3] : [0.3, 0.3, 0.33]))); // asfalto

// Linha de largada/chegada (xadrez) + pórtico
const cv = document.createElement('canvas'); cv.width = cv.height = 64;
const cx = cv.getContext('2d');
for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) { cx.fillStyle = (i + j) % 2 ? '#fff' : '#111'; cx.fillRect(i * 8, j * 8, 8, 8); }
const lineGeo = new THREE.PlaneGeometry(W, 4); lineGeo.rotateX(-Math.PI / 2);
const line = new THREE.Mesh(lineGeo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) }));
const h0 = Math.atan2(T[0].x, T[0].z);
line.position.set(S[0].x, S[0].y + .1, S[0].z); line.rotation.order = 'YXZ'; line.rotation.y = h0; line.rotation.x = -Math.atan((S[1].y - S[N - 1].y) / (2 * ds)); scene.add(line);
const gate = new THREE.Group();
const pm = new THREE.MeshLambertMaterial({ color: 0xffcc00 });
[-1, 1].forEach(s => { const p = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pm); p.position.set(s * (W / 2 + 3), 5, 0); gate.add(p); });
const bar = new THREE.Mesh(new THREE.BoxGeometry(W + 7, 2, 1), pm); bar.position.y = 10; gate.add(bar);
gate.position.copy(S[0]); gate.rotation.y = h0; scene.add(gate);

// Terreno com elevações: acompanha a altura da pista e volta a zero longe dela
  const xs = S.map(p => p.x), zs = S.map(p => p.z), cxm = (Math.min(...xs) + Math.max(...xs)) / 2, czm = (Math.min(...zs) + Math.max(...zs)) / 2;
  const half = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...zs) - Math.min(...zs)) / 2 + 380;
  const hAt = (x, z) => { let b = 1e9, k = 0;
    for (let i = 0; i < N; i += 3) { const q = (x - S[i].x) ** 2 + (z - S[i].z) ** 2; if (q < b) { b = q; k = i; } }
    const t = Math.min(1, Math.max(0, (Math.sqrt(b) - W / 2 - 8) / 90)), e = t * t * (3 - 2 * t);
    return (S[k].y - 1.6) * (1 - e) + e * (-2.8 + .4 * Math.sin(x * .02) * Math.cos(z * .017)); }; // terreno fica abaixo da pista (sem atravessá-la)
  const tg = new THREE.PlaneGeometry(half * 2, half * 2, 150, 150); tg.rotateX(-Math.PI / 2);
  const tp = tg.attributes.position;
  for (let i = 0; i < tp.count; i++) tp.setY(i, hAt(tp.getX(i) + cxm, tp.getZ(i) + czm));
  tg.computeVertexNormals();
  // Muros de contenção nas duas bordas: ligam a pista ao terreno e também servem de barreira
  [-1, 1].forEach(s => { const pos = [], idx = [];
    for (let i = 0; i <= N; i++) { const k = i % N, p = S[k], n = Nm[k], o = s * (W / 2 + 2.5);
      pos.push(p.x + n.x * o, p.y + .03, p.z + n.z * o, p.x + n.x * o, p.y - 4, p.z + n.z * o);
      if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x8a7a6a, side: THREE.DoubleSide }))); });
  const tt = gt.clone(); tt.needsUpdate = true; tt.repeat.set(half / 6, half / 6);
  const terrain = new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ map: tt, color: M.grass }));
  terrain.position.set(cxm, 0, czm); terrain.receiveShadow = true; scene.add(terrain);
  // Faixa central tracejada
  scene.add(ribbon(.7, .075, i => (Math.floor(i / 5) % 2 ? [.9, .9, .9] : [.28, .28, .31])));
  // Cenário instanciado: árvores (pinheiros de 2 copas e copas arredondadas) e tufos de grama
  const dum = new THREE.Object3D();
  const spots = (n, d0, d1, minD) => { const a = [];
    for (let t = 0; a.length < n && t < n * 8; t++) {
      const k = Math.random() * N | 0, s = Math.random() < .5 ? -1 : 1, d = d0 + Math.random() * d1;
      const x = S[k].x + Nm[k].x * d * s, z = S[k].z + Nm[k].z * d * s;
      if (!S.some(p => (p.x - x) ** 2 + (p.z - z) ** 2 < minD * minD)) a.push([x, z, .8 + Math.random() * .9, hAt(x, z)]);
    } return a; };
  const inst = (geo, hex, list, fn, shadow) => {
    const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: 0xffffff }), list.length);
    list.forEach((p, i) => { dum.position.set(0, 0, 0); dum.rotation.set(0, Math.random() * 6, 0); dum.scale.set(p[2], p[2], p[2]); fn(dum, p); dum.position.y += p[3]; dum.updateMatrix();
      im.setMatrixAt(i, dum.matrix); im.setColorAt(i, new THREE.Color(hex).offsetHSL(0, 0, (Math.random() - .5) * .1)); });
    im.castShadow = false; // sombras só nos carros (mais rápido) scene.add(im);
  };
  const all = spots(Math.round(M.trees * .7), W / 2 + 14, 70, W + 10), pines = all.filter((_, i) => i % 2), rounds = all.filter((_, i) => !(i % 2));
  inst(new THREE.CylinderGeometry(.5, .8, 5, 7), 0x5b3a1e, all, (o, p) => o.position.set(p[0], 2.5 * p[2], p[1]), true);
  inst(new THREE.ConeGeometry(4.2, 7, 9), M.leaf, pines, (o, p) => o.position.set(p[0], 6.5 * p[2], p[1]), true);
  inst(new THREE.ConeGeometry(3, 6, 9), M.leaf, pines, (o, p) => o.position.set(p[0], 9.5 * p[2], p[1]), true);
  inst(new THREE.IcosahedronGeometry(3.6, 1), M.leaf, rounds, (o, p) => { o.position.set(p[0], 8 * p[2], p[1]); o.scale.y *= .9; }, true);
  inst(new THREE.ConeGeometry(.25, 1.4, 4), new THREE.Color(M.grass).offsetHSL(0, .1, -.12).getHex(), spots(800, W / 2 + 3, 45, W / 2 + 2.5), (o, p) => o.position.set(p[0], .6 * p[2], p[1]));
  // Caixas de item (?) em 6 fileiras de 3
  boxes = [];
  const qc = document.createElement('canvas'); qc.width = qc.height = 64;
  (c => { c.fillStyle = '#ffb400'; c.fillRect(0, 0, 64, 64); c.fillStyle = '#fff'; c.font = 'bold 48px sans-serif'; c.textAlign = 'center'; c.fillText('?', 32, 50); })(qc.getContext('2d'));
  const qm = new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(qc), emissive: 0x553300 });
  for (let r = 0; r < 10; r++) { const k = Math.floor((r + .5) * N / 10);
    [-7, 0, 7].forEach(o => { const m = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), qm); m.castShadow = true;
      m.position.set(S[k].x + Nm[k].x * o, S[k].y + 1.6, S[k].z + Nm[k].z * o); scene.add(m); boxes.push({ m, t: 0, y: S[k].y + 1.6 }); }); }
  makeRadar(); world = scene.children.slice(n0);
}

// ================= CARROS =================
// Textura da banda de rodagem (blocos de borracha alternados)
const treadCv = document.createElement('canvas'); treadCv.width = 256; treadCv.height = 64;
(c => {
  c.fillStyle = '#141414'; c.fillRect(0, 0, 256, 64); c.fillStyle = '#343434';
  for (let i = 0; i < 32; i++) { c.fillRect(i * 8, 3, 5, 27); c.fillRect(i * 8 + 4, 34, 4, 27); }
})(treadCv.getContext('2d'));
const treadTex = new THREE.CanvasTexture(treadCv);
// Emblema rosa/branco no capô
const embCv = document.createElement('canvas'); embCv.width = embCv.height = 64;
(c => {
  c.fillStyle = '#fff'; c.fillRect(0, 0, 64, 64); c.fillStyle = '#ff4fa3';
  [[22, 24, 9], [40, 22, 7], [30, 42, 10], [46, 42, 6]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); });
})(embCv.getContext('2d'));
const embTex = new THREE.CanvasTexture(embCv);

// Roda: pneu largo com banda de rodagem, cubo amarelo, tampa e raio (para ver o giro)
function makeWheel(r, w, hc = 0xe6e04a) {
  const pivot = new THREE.Group(), spin = new THREE.Group();
  const dark = new THREE.MeshLambertMaterial({ color: 0x151515 });
  const tg = new THREE.CylinderGeometry(r, r, w, 28); tg.rotateZ(Math.PI / 2);
  const tire = new THREE.Mesh(tg, [new THREE.MeshStandardMaterial({ map: treadTex, roughness: .95 }), dark, dark]);
  const hg = new THREE.CylinderGeometry(r * .55, r * .55, w + .1, 20); hg.rotateZ(Math.PI / 2);
  const hub = new THREE.Mesh(hg, new THREE.MeshStandardMaterial({ color: hc, metalness: .9, roughness: .25 }));
  const cg = new THREE.CylinderGeometry(r * .2, r * .2, w + .16, 10); cg.rotateZ(Math.PI / 2);
  const cap = new THREE.Mesh(cg, dark);
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(w + .12, r * 1.0, .1), dark);
  spin.add(tire, hub, cap); for (let a = 0; a < 5; a++) { const sp = spoke.clone(); sp.rotation.x = a * Math.PI / 5; spin.add(sp); } // raios da roda
  pivot.add(spin); pivot.userData.spin = spin;
  return pivot;
}

// Kart estilo arcade realista: chassi colorido, asas brancas, eixos rosa, assento, volante e escapamentos
// Reflexos (céu em degradê) para pintura e cromados, 
const ENV = (() => {
  const faces = [0, 1, 2, 3, 4, 5].map(i => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 64);
    if (i === 2) { g.addColorStop(0, '#6fb4ff'); g.addColorStop(1, '#bfe0ff'); } else if (i === 3) { g.addColorStop(0, '#3a4a3a'); g.addColorStop(1, '#2c3a2c'); }
    else { g.addColorStop(0, '#5fa8ee'); g.addColorStop(.5, '#eaf4ff'); g.addColorStop(.52, '#556b4f'); g.addColorStop(1, '#2c3a2c'); }
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c; });
  const t = new THREE.CubeTexture(faces); t.needsUpdate = true; return t; })();
scene.environment = ENV;

// ================= PERSONAGENS, CARROS E MENU =================
const CHARS = [

  if ((radarT += dt) > .05) { radarT = 0; drawRadar(); }
  if (state !== 'menu') renderer.render(scene, camera);
}
setupCars(0); buildMap(0); init(); buildMenu();
camera.position.set(player.x, 5.5, player.z - 13);
requestAnimationFrame(loop);
</script>
